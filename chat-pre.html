<!-- SCRIPT SALESFORCE EMBEDDED MESSAGING (Forzato) -->
  <script type='text/javascript'>
    function initEmbeddedMessaging() {
      try {
        embeddedservice_bootstrap.settings.language = 'it';

        embeddedservice_bootstrap.init(
          '00DFg00000I7vvF',
          'Letizia_PCC',
          'https://axaitalia--pre.sandbox.my.site.com/ESWLetiziaPCC1760431838771',
          {
            scrt2URL: 'https://axaitalia--pre.sandbox.my.salesforce-scrt.com'
          }
        );

        // Abilita comunque il pulsante dopo l'init di Salesforce
        var customBtn = document.getElementById("btnCustomChat");
        customBtn.disabled = false;
        customBtn.style.backgroundColor = '#00008F';
        customBtn.style.cursor = 'pointer';
        customBtn.innerHTML = '💬 Avvia la Chat';
        console.log("Inizializzazione Embedded Messaging completata.");

      } catch (err) {
        console.error('Error loading Embedded Messaging: ', err);
      }
    };

    function bootstrapChat() {
      var page = document.getElementById('page').value;
      var emailFromUser = document.getElementById('email').value;
      var cf_piva = document.getElementById('cf_piva').value;
      var nome = document.getElementById('name').value;
      var cognome = document.getElementById('lastname').value;
      var ndg = document.getElementById('ndg').value;
      var multindg = document.getElementById('multindg').value;

      var techCompany = 'AAI';
      var isMultiNdg = '0';

      if(ndg === '' && multindg === '') {
        techCompany = 'AXA MPS';
      } else if(ndg === '' && multindg !== '') {
        ndg = multindg;
        isMultiNdg = '1';
      }

      try {
        // 1. Passaggio dei parametri nascosti (Hidden Pre-Chat API)
        if (window.embeddedservice_bootstrap && window.embeddedservice_bootstrap.prechatAPI) {
          embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
            "ndg": ndg,
            "Codice_Fiscale_o_IVA__c": cf_piva,
            "techCompany": techCompany,
            "homePageFrom__c": page,
            "Name__c": nome,
            "LastName__c": cognome,
            "Email__c": emailFromUser,
            "IsMultiNdg__c": isMultiNdg
          });
        }

        // 2. Metodo alternativo di apertura tramite bootstrap API (se disponibile nella versione)
        if (window.embeddedservice_bootstrap && typeof embeddedservice_bootstrap.utilAPI !== 'undefined' && typeof embeddedservice_bootstrap.utilAPI.launch === 'function') {
          embeddedservice_bootstrap.utilAPI.launch();
        } else {
          // Fallback sul click nativo se presente
          var embeddedMessaging = document.querySelector('embedded-messaging');
          if (embeddedMessaging && embeddedMessaging.shadowRoot) {
            var chatButton = embeddedMessaging.shadowRoot.querySelector('.embeddedMessagingConversationButton') || 
                             embeddedMessaging.shadowRoot.querySelector('button');
            if (chatButton) {
              chatButton.click();
            } else {
              console.warn("Elemento chat nativo non trovato nel DOM, verifica la console per errori di rete/CORS.");
            }
          }
        }
      } catch (error) {
        console.error("Errore durante l'avvio della chat: ", error);
      }
    }
  </script>
  
  <script type='text/javascript' src='https://axaitalia--pre.sandbox.my.site.com/ESWLetiziaPCC1760431838771/assets/js/bootstrap.min.js' onload='initEmbeddedMessaging()'></script>
